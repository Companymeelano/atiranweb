plugins { id 'com.android.application' }

android {
    namespace 'ir.meelano.android'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.meelano.android'
        minSdk 24
        targetSdk 35
        versionCode 41
        versionName '3.36.0-direct-sql-visitor-showcase-cart'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            // Installable APK for direct delivery. Replace with a private release keystore for Play Store publishing.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'net.sourceforge.jtds:jtds:1.3.1'
}
