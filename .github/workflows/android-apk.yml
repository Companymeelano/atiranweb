name: Build MEELANO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0d321-atiranweb
    paths:
      - 'MEELANO-Android/**'
      - 'MEELANO-Android-APK-Project.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APKs
        working-directory: MEELANO-Android
        run: gradle :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Collect APK files
        run: |
          mkdir -p artifacts
          cp MEELANO-Android/app/build/outputs/apk/release/app-release.apk artifacts/MEELANO-Android-v1.1.0.apk
          cp MEELANO-Android/app/build/outputs/apk/debug/app-debug.apk artifacts/MEELANO-Android-v1.1.0-debug.apk
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEELANO-Android-installable-apk
          path: artifacts/
          if-no-files-found: error
