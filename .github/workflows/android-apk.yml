name: Build MEELANO Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0d321-atiranweb
    paths:
      - 'MEELANO-Android/**'
      - 'MEELANO-Android-APK-Project.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android and Gradle toolchain
        run: |
          java -version
          gradle -v
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/platforms" ]; then ls "$ANDROID_HOME/platforms" | tail -20; fi

      - name: Accept Android licenses and ensure SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true

      - name: Verify this is native Android, not PWA/WebView
        run: |
          if grep -R "android.webkit\|WebView\|loadUrl" -n MEELANO-Android/app/src/main/java; then
            echo "WebView/PWA wrapper code detected; native build refused."
            exit 1
          fi

      - name: Build installable native APKs
        working-directory: MEELANO-Android
        run: gradle :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Collect APK files
        run: |
          mkdir -p artifacts
          cp MEELANO-Android/app/build/outputs/apk/release/app-release.apk artifacts/MEELANO-Android-Native-v2.0.0.apk
          cp MEELANO-Android/app/build/outputs/apk/debug/app-debug.apk artifacts/MEELANO-Android-Native-v2.0.0-debug.apk
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt

      - name: Commit installable native APK to this branch
        if: github.event_name == 'push'
        run: |
          rm -f MEELANO-Android-v1.1.0.apk MEELANO-Android-v1.1.0-SHA256SUMS.txt
          cp artifacts/MEELANO-Android-Native-v2.0.0.apk MEELANO-Android-Native-v2.0.0.apk
          cp artifacts/SHA256SUMS.txt MEELANO-Android-Native-v2.0.0-SHA256SUMS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f MEELANO-Android-Native-v2.0.0.apk MEELANO-Android-Native-v2.0.0-SHA256SUMS.txt
          git commit -m "Add native Android installable APK [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload native APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEELANO-Native-Android-installable-apk
          path: artifacts/
          if-no-files-found: error
